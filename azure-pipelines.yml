# =============================================================================
# Azure DevOps Pipeline for Copilot Studio Agent Testing
# =============================================================================
# Alternative pipeline for organizations using Azure DevOps instead of GitHub
#
# Required Variable Groups:
#   - copilot-studio-dev (for dev environment)
#   - copilot-studio-staging (for staging environment)
#   - copilot-studio-prod (for production environment)
#
# Each variable group should contain:
#   - APP_CLIENT_ID
#   - APP_CLIENT_SECRET (secret)
#   - TENANT_ID
#   - ENVIRONMENT_ID
#   - AGENT_IDENTIFIER
#   - OPENAI_API_KEY (secret) - for OpenAI
#   OR Azure OpenAI variables:
#   - AZURE_OPENAI_ENDPOINT
#   - AZURE_OPENAI_API_KEY (secret)
#   - AZURE_OPENAI_DEPLOYMENT
#   - TEAMS_WEBHOOK_URL (optional)
#   - STORAGE_ACCOUNT_NAME (optional - for archiving)
#   - AZURE_SERVICE_CONNECTION (optional - for archiving)
# =============================================================================

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - tests/*
      - testinglib/*
      - input/*

pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 2 * * *'
    displayName: 'Nightly Test Run'
    branches:
      include:
        - main
    always: true

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - staging
      - prod
  
  - name: sendNotifications
    displayName: 'Send Teams Notifications'
    type: boolean
    default: true

variables:
  pythonVersion: '3.11'
  
stages:
  # ==========================================================================
  # Stage: Run Tests
  # ==========================================================================
  - stage: Test
    displayName: 'Run Agent Tests'
    jobs:
      - job: RunTests
        displayName: 'Execute Copilot Studio Tests'
        timeoutInMinutes: 30
        pool:
          vmImage: 'ubuntu-latest'
        
        variables:
          - group: copilot-studio-${{ parameters.environment }}
        
        steps:
          # --------------------------------------------------------------------
          # Setup Python
          # --------------------------------------------------------------------
          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true
          
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest-azurepipelines junit-xml
            displayName: 'Install Dependencies'
          
          # --------------------------------------------------------------------
          # Configure DeepEval (Azure OpenAI or OpenAI)
          # --------------------------------------------------------------------
          - script: |
              # Check if Azure OpenAI is configured
              if [ -n "$(AZURE_OPENAI_ENDPOINT)" ] && [ -n "$(AZURE_OPENAI_API_KEY)" ]; then
                echo "Configuring Azure OpenAI..."
                deepeval set-azure-openai \
                  --openai-endpoint="$(AZURE_OPENAI_ENDPOINT)" \
                  --openai-api-key="$(AZURE_OPENAI_API_KEY)" \
                  --deployment-name="$(AZURE_OPENAI_DEPLOYMENT)" \
                  --openai-model-name="gpt-4o" \
                  --openai-api-version="2025-01-01-preview"
              elif [ -n "$(OPENAI_API_KEY)" ]; then
                echo "Using OpenAI API key from environment"
                # OpenAI is configured via environment variable automatically
              else
                echo "##vso[task.logissue type=warning]No LLM API key configured"
              fi
            displayName: 'Configure DeepEval LLM'
            env:
              OPENAI_API_KEY: $(OPENAI_API_KEY)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
              AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
              AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
          
          # --------------------------------------------------------------------
          # Run Tests
          # --------------------------------------------------------------------
          - script: |
              mkdir -p reports
              pytest tests/ \
                -v \
                --tb=short \
                --junitxml=reports/test-results.xml \
                2>&1 | tee test-output.log
              
              # Store exit code for later steps
              echo "##vso[task.setvariable variable=TEST_EXIT_CODE]$?"
            displayName: 'Run Copilot Studio Tests'
            env:
              APP_CLIENT_ID: $(APP_CLIENT_ID)
              APP_CLIENT_SECRET: $(APP_CLIENT_SECRET)
              TENANT_ID: $(TENANT_ID)
              ENVIRONMENT_ID: $(ENVIRONMENT_ID)
              AGENT_IDENTIFIER: $(AGENT_IDENTIFIER)
              OPENAI_API_KEY: $(OPENAI_API_KEY)
              ENVIRONMENT: ${{ parameters.environment }}
              CI: true
            continueOnError: true
          
          # --------------------------------------------------------------------
          # Publish Results
          # --------------------------------------------------------------------
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/test-results.xml'
              testRunTitle: 'Copilot Studio Tests - ${{ parameters.environment }}'
              failTaskOnFailedTests: true
            condition: always()
          
          - task: PublishPipelineArtifact@1
            displayName: 'Publish HTML Report'
            inputs:
              targetPath: 'reports/evaluation_report.html'
              artifact: 'EvaluationReport-$(Build.BuildNumber)'
              publishLocation: 'pipeline'
            condition: always()
          
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Test Log'
            inputs:
              targetPath: 'test-output.log'
              artifact: 'TestLog-$(Build.BuildNumber)'
              publishLocation: 'pipeline'
            condition: always()
          
          # --------------------------------------------------------------------
          # Teams Notification (only if webhook is configured)
          # --------------------------------------------------------------------
          - ${{ if eq(parameters.sendNotifications, true) }}:
            - script: |
                # Skip if webhook URL is not configured
                if [ -z "$TEAMS_WEBHOOK_URL" ]; then
                  echo "Teams webhook not configured, skipping notification"
                  exit 0
                fi
                
                # Parse JUnit XML test results properly
                # JUnit XML format: <testsuite tests="X" failures="Y" errors="Z" skipped="W">
                if [ -f reports/test-results.xml ]; then
                  TOTAL=$(grep -oP 'tests="\K[0-9]+' reports/test-results.xml | head -1 || echo "0")
                  FAILURES=$(grep -oP 'failures="\K[0-9]+' reports/test-results.xml | head -1 || echo "0")
                  ERRORS=$(grep -oP 'errors="\K[0-9]+' reports/test-results.xml | head -1 || echo "0")
                  SKIPPED=$(grep -oP 'skipped="\K[0-9]+' reports/test-results.xml | head -1 || echo "0")
                  
                  # Calculate passed (total - failures - errors - skipped)
                  FAILED=$((FAILURES + ERRORS))
                  PASSED=$((TOTAL - FAILED - SKIPPED))
                  
                  # Calculate pass rate
                  if [ "$TOTAL" -gt 0 ]; then
                    PASS_RATE=$(echo "scale=1; $PASSED * 100 / $TOTAL" | bc)
                  else
                    PASS_RATE="0"
                  fi
                else
                  TOTAL=0
                  PASSED=0
                  FAILED=0
                  PASS_RATE="0"
                  echo "##vso[task.logissue type=warning]Test results file not found"
                fi
                
                # Determine status
                if [ "$FAILED" = "0" ] && [ "$TOTAL" -gt 0 ]; then
                  STATUS="✅ Passed"
                  COLOR="00FF00"
                else
                  STATUS="❌ Failed"
                  COLOR="FF0000"
                fi
                
                # Send notification
                curl -s -H "Content-Type: application/json" \
                  -d "{
                    \"@type\": \"MessageCard\",
                    \"@context\": \"http://schema.org/extensions\",
                    \"themeColor\": \"$COLOR\",
                    \"summary\": \"Copilot Studio Test Results\",
                    \"sections\": [{
                      \"activityTitle\": \"$STATUS - Copilot Studio Agent Tests\",
                      \"activitySubtitle\": \"Environment: ${{ parameters.environment }} | Build $(Build.BuildNumber)\",
                      \"facts\": [
                        {\"name\": \"Passed\", \"value\": \"$PASSED\"},
                        {\"name\": \"Failed\", \"value\": \"$FAILED\"},
                        {\"name\": \"Total\", \"value\": \"$TOTAL\"},
                        {\"name\": \"Pass Rate\", \"value\": \"${PASS_RATE}%\"},
                        {\"name\": \"Branch\", \"value\": \"$(Build.SourceBranchName)\"},
                        {\"name\": \"Triggered by\", \"value\": \"$(Build.RequestedFor)\"}
                      ]
                    }],
                    \"potentialAction\": [{
                      \"@type\": \"OpenUri\",
                      \"name\": \"View Build\",
                      \"targets\": [{
                        \"os\": \"default\",
                        \"uri\": \"$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)\"
                      }]
                    }]
                  }" \
                  "$TEAMS_WEBHOOK_URL" || echo "##vso[task.logissue type=warning]Failed to send Teams notification"
              displayName: 'Send Teams Notification'
              condition: always()
              env:
                TEAMS_WEBHOOK_URL: $(TEAMS_WEBHOOK_URL)

  # ==========================================================================
  # Stage: Archive Results (optional)
  # ==========================================================================
  - stage: Archive
    displayName: 'Archive Results'
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: ArchiveResults
        displayName: 'Archive to Storage'
        pool:
          vmImage: 'ubuntu-latest'
        
        variables:
          - group: copilot-studio-${{ parameters.environment }}
        
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'EvaluationReport-$(Build.BuildNumber)'
              targetPath: '$(Pipeline.Workspace)/report'
          
          - task: AzureCLI@2
            displayName: 'Upload to Blob Storage'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Upload report to blob storage with date-based path
                DATE=$(date +%Y/%m/%d)
                az storage blob upload \
                  --account-name "$(STORAGE_ACCOUNT_NAME)" \
                  --container-name test-results \
                  --name "$DATE/evaluation_report_$(Build.BuildNumber).html" \
                  --file "$(Pipeline.Workspace)/report/evaluation_report.html" \
                  --auth-mode login \
                  --overwrite true
            condition: |
              and(
                succeeded(),
                ne(variables['STORAGE_ACCOUNT_NAME'], ''),
                ne(variables['AZURE_SERVICE_CONNECTION'], '')
              )
