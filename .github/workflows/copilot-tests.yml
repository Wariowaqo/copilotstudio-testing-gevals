# =============================================================================
# Copilot Studio Agent Testing - GitHub Actions CI/CD Pipeline
# =============================================================================
# This workflow runs automated tests against Copilot Studio agents
# 
# Triggers:
#   - Push to main/develop branches
#   - Pull requests to main
#   - Manual trigger with environment selection
#   - Scheduled nightly runs
#
# Required Secrets:
#   - APP_CLIENT_ID
#   - APP_CLIENT_SECRET  
#   - TENANT_ID
#   - ENVIRONMENT_ID
#   - AGENT_IDENTIFIER
#   - OPENAI_API_KEY (for OpenAI) OR Azure OpenAI secrets below
#   - AZURE_OPENAI_ENDPOINT (optional - for Azure OpenAI)
#   - AZURE_OPENAI_API_KEY (optional - for Azure OpenAI)
#   - AZURE_OPENAI_DEPLOYMENT (optional - for Azure OpenAI)
#   - TEAMS_WEBHOOK_URL (optional)
# =============================================================================

name: Copilot Studio Agent Tests

on:
  # Run on push to main branches
  push:
    branches: [main, develop]
    paths:
      - 'tests/**'
      - 'testinglib/**'
      - 'input/**'
      - '.github/workflows/copilot-tests.yml'
  
  # Run on PRs to main
  pull_request:
    branches: [main]
  
  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      notify:
        description: 'Send notifications'
        required: false
        default: true
        type: boolean
  
  # Scheduled nightly runs (2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

# Prevent concurrent runs for same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  # Default environment for scheduled/push runs
  DEFAULT_ENVIRONMENT: 'dev'

jobs:
  # ==========================================================================
  # Job: Run Tests
  # ==========================================================================
  test:
    name: Run Agent Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # Use environment-specific secrets
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      # ----------------------------------------------------------------------
      # Setup
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-json-report
      
      # ----------------------------------------------------------------------
      # Configure LLM for DeepEval (OpenAI or Azure OpenAI)
      # ----------------------------------------------------------------------
      - name: Configure DeepEval LLM
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          # Check if Azure OpenAI is configured, otherwise use OpenAI
          if [ -n "$AZURE_OPENAI_ENDPOINT" ] && [ -n "$AZURE_OPENAI_API_KEY" ]; then
            echo "Configuring Azure OpenAI..."
            deepeval set-azure-openai \
              --openai-endpoint="${AZURE_OPENAI_ENDPOINT}" \
              --openai-api-key="${AZURE_OPENAI_API_KEY}" \
              --deployment-name="${AZURE_OPENAI_DEPLOYMENT}" \
              --openai-model-name="gpt-4o" \
              --openai-api-version="2025-01-01-preview"
          elif [ -n "$OPENAI_API_KEY" ]; then
            echo "Using OpenAI API key from environment"
            # OpenAI is configured via environment variable automatically
          else
            echo "Warning: No LLM API key configured"
          fi
      
      # ----------------------------------------------------------------------
      # Run Tests
      # ----------------------------------------------------------------------
      - name: Run Copilot Studio Tests
        id: tests
        env:
          # Authentication
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_CLIENT_SECRET: ${{ secrets.APP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          
          # Agent Configuration
          ENVIRONMENT_ID: ${{ secrets.ENVIRONMENT_ID }}
          AGENT_IDENTIFIER: ${{ secrets.AGENT_IDENTIFIER }}
          
          # OpenAI API Key (DeepEval will use this automatically)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # Environment
          ENVIRONMENT: ${{ github.event.inputs.environment || env.DEFAULT_ENVIRONMENT }}
          CI: true
        run: |
          # Create reports directory
          mkdir -p reports
          
          # Run tests with JSON report for processing
          pytest tests/ \
            -v \
            --tb=short \
            --json-report \
            --json-report-file=reports/test-results.json \
            2>&1 | tee test-output.log
          
          # Capture exit code
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "test_exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Extract summary for notification
          if [ -f reports/test-results.json ]; then
            PASSED=$(jq '.summary.passed // 0' reports/test-results.json)
            FAILED=$(jq '.summary.failed // 0' reports/test-results.json)
            TOTAL=$(jq '.summary.total // 0' reports/test-results.json)
            DURATION=$(jq '.duration // 0' reports/test-results.json)
            
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "duration=$DURATION" >> $GITHUB_OUTPUT
            
            # Calculate pass rate
            if [ "$TOTAL" -gt 0 ]; then
              PASS_RATE=$(echo "scale=2; $PASSED * 100 / $TOTAL" | bc)
            else
              PASS_RATE=0
            fi
            echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
          fi
          
          # Exit with test result
          exit $TEST_EXIT_CODE
        continue-on-error: true
      
      # ----------------------------------------------------------------------
      # Upload Artifacts
      # ----------------------------------------------------------------------
      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report-${{ github.run_number }}
          path: reports/evaluation_report.html
          retention-days: 30
      
      - name: Upload Test Results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: reports/test-results.json
          retention-days: 30
      
      - name: Upload Test Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ github.run_number }}
          path: test-output.log
          retention-days: 7
      
      # ----------------------------------------------------------------------
      # Notifications
      # ----------------------------------------------------------------------
      - name: Send Teams Notification
        if: |
          always() && 
          (github.event.inputs.notify != 'false') &&
          (env.TEAMS_WEBHOOK_URL != '')
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEST_PASSED: ${{ steps.tests.outputs.passed }}
          TEST_FAILED: ${{ steps.tests.outputs.failed }}
          TEST_TOTAL: ${{ steps.tests.outputs.total }}
          PASS_RATE: ${{ steps.tests.outputs.pass_rate }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.test_exit_code }}
          ENVIRONMENT: ${{ github.event.inputs.environment || env.DEFAULT_ENVIRONMENT }}
        run: |
          # Determine status color and emoji
          if [ "$TEST_EXIT_CODE" = "0" ]; then
            STATUS="✅ Passed"
            THEME_COLOR="00FF00"
          else
            STATUS="❌ Failed"
            THEME_COLOR="FF0000"
          fi
          
          # Send Teams notification
          curl -H "Content-Type: application/json" \
            -d "{
              \"@type\": \"MessageCard\",
              \"@context\": \"http://schema.org/extensions\",
              \"themeColor\": \"$THEME_COLOR\",
              \"summary\": \"Copilot Studio Test Results\",
              \"sections\": [{
                \"activityTitle\": \"$STATUS - Copilot Studio Agent Tests\",
                \"activitySubtitle\": \"Environment: $ENVIRONMENT | Run #${{ github.run_number }}\",
                \"facts\": [
                  {\"name\": \"Passed\", \"value\": \"$TEST_PASSED\"},
                  {\"name\": \"Failed\", \"value\": \"$TEST_FAILED\"},
                  {\"name\": \"Total\", \"value\": \"$TEST_TOTAL\"},
                  {\"name\": \"Pass Rate\", \"value\": \"${PASS_RATE}%\"},
                  {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\"},
                  {\"name\": \"Triggered by\", \"value\": \"${{ github.actor }}\"}
                ],
                \"markdown\": true
              }],
              \"potentialAction\": [{
                \"@type\": \"OpenUri\",
                \"name\": \"View Run\",
                \"targets\": [{
                  \"os\": \"default\",
                  \"uri\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                }]
              }]
            }" \
            "$TEAMS_WEBHOOK_URL"
      
      # ----------------------------------------------------------------------
      # Final Status
      # ----------------------------------------------------------------------
      - name: Check Test Results
        if: steps.tests.outputs.test_exit_code != '0'
        run: |
          echo "::error::Tests failed with exit code ${{ steps.tests.outputs.test_exit_code }}"
          echo "Passed: ${{ steps.tests.outputs.passed }}"
          echo "Failed: ${{ steps.tests.outputs.failed }}"
          echo "Total: ${{ steps.tests.outputs.total }}"
          exit 1

  # ==========================================================================
  # Job: Publish Report to GitHub Pages (optional)
  # ==========================================================================
  publish-report:
    name: Publish Report
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    
    permissions:
      pages: write
      id-token: write
    
    steps:
      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: evaluation-report-${{ github.run_number }}
          path: report
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: report
      
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
